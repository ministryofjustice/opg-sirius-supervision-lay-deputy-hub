services:
  lay-deputy-hub:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/sirius-lay-deputy-hub
    depends_on:
      - json-server
    build:
      context: .
      dockerfile: docker/lay-deputy-hub/Dockerfile
      target: prod
    ports:
      - "1234:1234"
    read_only: false
    environment:
      PORT: 1234
      PREFIX: /supervision/deputies/lay
      HEALTHCHECK: /supervision/deputies/lay/health-check
      JWT_SECRET: mysupersecrettestkeythatis128bits
      SIRIUS_URL: http://json-server:3000

  json-server:
    build:
      dockerfile: docker/json-server/Dockerfile
    volumes:
      - ./json-server/config:/app/config

  go-lint:
    image: golangci/golangci-lint:v2.15.0@sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.cache/golangci-lint/v2.15.0:/root/.cache
    command: golangci-lint run -v --timeout 5m

  gosec:
    image: golang:1.27.3-alpine@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c
    working_dir: /app
    volumes:
      - .:/app
    command: go tool gosec -exclude-dir=.gocache -fmt=sarif -out=/app/test-results/gosec.sarif -stdout -verbose=text /app/...

  test-runner:
    build:
      context: docker/test-runner/
    command: gotestsum --junitfile test-results/unit-tests.xml -- ./... -coverprofile=test-results/test-coverage.txt
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.gocache:/go/pkg/mod

  watch-assets:
    image: node:24-alpine3.24@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    working_dir: /home/node/app
    entrypoint: ["sh"]
    volumes:
      - ./:/home/node/app
      - watch-assets-node-modules:/home/node/app/node_modules

  cypress:
    build:
      dockerfile: docker/cypress/Dockerfile
    command: [ "--headless", "-b", "electron" ]
    volumes:
      - ./cypress/screenshots:/root/screenshots:rw,delegated
      - ./cypress/logs:/root/cypress/logs:rw,delegated
    depends_on:
      lay-deputy-hub:
        condition: service_healthy

volumes:
    watch-assets-node-modules:
