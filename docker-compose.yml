services:
  lay-deputy-hub:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/sirius-lay-deputy-hub
    depends_on:
      - json-server
    build:
      context: .
      dockerfile: docker/lay-deputy-hub/Dockerfile
      target: prod
    ports:
      - "1234:1234"
    read_only: false
    environment:
      PORT: 1234
      PREFIX: /supervision/deputies/lay
      HEALTHCHECK: /supervision/deputies/lay/health-check
      JWT_SECRET: mysupersecrettestkeythatis128bits
      SIRIUS_URL: http://json-server:3000

  json-server:
    build:
      dockerfile: docker/json-server/Dockerfile
    volumes:
      - ./json-server/config:/app/config

  go-lint:
    image: golangci/golangci-lint:v2.12.2@sha256:5cceeef04e53efe1470638d4b4b4f5ceefd574955ab3941b2d9a68a8c9ad5240
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.cache/golangci-lint/v2.4.0:/root/.cache
    command: golangci-lint run -v --timeout 5m

  test-runner:
    build:
      context: docker/test-runner/
    command: gotestsum --junitfile test-results/unit-tests.xml -- ./... -coverprofile=test-results/test-coverage.txt
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.gocache:/go/pkg/mod

  watch-assets:
    image: node:24-alpine3.23@sha256:9ec4a2e289874ed0d722e1772ec2de45d2801541db8612f3638b26f128c69ac2
    working_dir: /home/node/app
    entrypoint: ["sh"]
    volumes:
      - ./:/home/node/app
      - watch-assets-node-modules:/home/node/app/node_modules

  cypress:
    build:
      dockerfile: docker/cypress/Dockerfile
    command: [ "--headless", "-b", "electron" ]
    volumes:
      - ./cypress/screenshots:/root/cypress/screenshots:rw,delegated
      - ./cypress/logs:/root/cypress/logs:rw,delegated
    depends_on:
      lay-deputy-hub:
        condition: service_healthy

volumes:
    watch-assets-node-modules:
