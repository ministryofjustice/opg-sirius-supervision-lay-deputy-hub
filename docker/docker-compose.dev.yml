services:
  lay-deputy-hub:
    build:
      target: dev
    ports:
      - "6666:6666"
      - "2345:2345"
    volumes:
      - ./.air.toml:/app/.air.toml
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./main.go:/app/main.go
      - ./internal:/app/internal
      - ./web/static:/app/web/static
      - ./web/template:/app/web/template
      - ./shared:/app/shared
    environment:
      SIRIUS_URL: http://json-server:3000
      PREFIX: /supervision/deputies/lay

  watch-assets:
     working_dir: /app
     command: -c "npm ci --ignore-scripts && npm run watch"
     volumes:
       - ./.npmrc:/app/.npmrc
       - ./package.json:/app/package.json
       - ./package-lock.json:/app/package-lock.json
       - ./web:/app/web

  json-server:
    build:
      dockerfile: docker/json-server/Dockerfile
    volumes:
      - ./json-server/config:/app/config
    ports:
      - '3000:3000'