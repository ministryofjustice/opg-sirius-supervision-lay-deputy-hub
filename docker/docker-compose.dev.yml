services:
  lay-deputy-hub:
    build:
      target: dev
    ports:
      - "1234:1234"
      - "2345:2345"
    volumes:
      - ./.air.toml:/app/.air.toml
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./main.go:/app/main.go
      - ./internal:/app/internal
      - ./web/static:/app/web/static
      - ./web/template:/app/web/template
      - ./shared:/app/shared

  yarn:
    command: watch