services:
  lay-deputy-hub:
    build:
      target: dev
    ports:
      - "1234:1234"
      - "2345:2345"
    environment:
      GOCACHE: /app/tmp/go-build
      HOME: /app/tmp
      XDG_CONFIG_HOME: /app/tmp/.config
    tmpfs:
      - /app/tmp:exec,mode=1777
      - /tmp:exec,mode=1777
    volumes:
      - ./.air.toml:/app/.air.toml
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
      - ./main.go:/app/main.go
      - ./internal:/app/internal
      - ./web/static:/app/web/static
      - ./web/template:/app/web/template
      - ./shared:/app/shared

  yarn:
    command: watch